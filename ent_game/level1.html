<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 1 · Quantum Blocks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&display=swap');
*{box-sizing:border-box}
:root{--ink:#0F2027;--blue:#5DADE2;--blue2:#D6EAF8;--pale:#F0F8FF;--pass:#20a464;--block:#d94343}
body{margin:0;min-height:100vh;padding:24px 18px;font-family:Arial,sans-serif;color:var(--ink);background-color:var(--pale);background-image:linear-gradient(45deg,var(--blue2) 25%,transparent 25%,transparent 50%,var(--blue2) 50%,var(--blue2) 75%,transparent 75%,transparent);background-size:100px 100px}
.wrap{max-width:940px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:2px;color:#2874a6}
h1{font:clamp(2.1rem,5vw,3.2rem) 'Titan One',cursive;color:white;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 #3498DB;margin:5px 0}
.home{border:3px solid var(--ink);border-radius:30px;background:white;padding:9px 16px;color:var(--ink);font-weight:900;text-decoration:none;box-shadow:0 4px 0 #3498DB}
.progress{display:flex;gap:7px;margin-bottom:18px}.bar{height:7px;flex:1;border:2px solid var(--ink);border-radius:9px;background:white}.bar:first-child{background:var(--blue)}
.sources{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.panel{background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:17px;box-shadow:7px 7px 0 #85C1E9;min-width:0}
.panel-title{font-size:12px;letter-spacing:1.5px;font-weight:900;margin:0 0 13px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.state{font:bold 19px Georgia;border:3px solid var(--ink);border-radius:12px;background:white;color:var(--ink);padding:9px 14px;box-shadow:0 3px 0 #3498DB;cursor:pointer;transition:.16s}
.state:hover{transform:translateY(-2px);background:#EAF5FC}
.state.active{background:var(--blue);color:white;box-shadow:0 4px 0 var(--ink)}
.operator{border:4px solid var(--ink);border-radius:18px;background:var(--blue);color:white;padding:15px 13px;text-align:center;box-shadow:5px 5px 0 var(--ink);min-width:142px}
.operator small{display:block;font-size:10px;font-weight:900;letter-spacing:1.4px;margin-bottom:7px}
.operator strong{font:25px Georgia;white-space:nowrap}
.table{margin-top:18px}
.table-head{font-size:12px;font-weight:900;letter-spacing:1.5px;margin:0 0 12px}
.cross-table{width:100%;border-collapse:separate;border-spacing:10px;table-layout:fixed}
.cross-table td,.cross-table th{height:100px;text-align:center;vertical-align:middle;border:3px solid var(--ink);border-radius:15px;background:#F4FAFE}
.cross-table .axis-corner{width:34%;background:#F4FAFE;border:3px dashed #85C1E9;padding:8px}
.token-tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(42px,auto);gap:8px;align-items:center;justify-items:stretch;min-height:74px}
.tray-empty{grid-column:1/-1;font-size:11px;font-weight:900;color:#78909c;letter-spacing:1px}
.cross-table .axis-heading{height:50px;background:#EAF5FC;border:3px solid var(--ink);font-size:16px;font-weight:900;color:#24465B;letter-spacing:.3px}
.cross-table .intersection{background:#EAF5FC;border:3px solid var(--ink);padding:12px;transition:.2s}
.drop-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.drop-slot{min-width:0;min-height:76px;display:flex;align-items:center;justify-content:center;background:#F8FCFF;border:3px dashed #85C1E9;border-radius:13px;font:900 16px Arial;color:#426174;transition:.2s;padding:5px}
.drop-slot.active-drop{border:3px solid #3498DB;box-shadow:0 0 0 4px #BFE6FF,0 0 22px 8px #5DADE2;background:#EAF7FF;animation:stagePulse 1.35s infinite}
.drop-slot.filled{border-style:solid;background:#DDF2FF}
.drop-slot .placed{font:18px Georgia;background:white;border:2px solid var(--ink);border-radius:12px;padding:8px 9px;box-shadow:0 3px 0 #3498DB;white-space:nowrap}
.token{position:relative;width:100%;min-width:0;font:bold 16px Georgia;border:3px solid var(--ink);border-radius:11px;background:#EAF7FF;color:var(--ink);padding:8px 5px;box-shadow:0 4px 0 #3498DB;cursor:grab;user-select:none;white-space:nowrap;transition:.16s;animation:choicesPop .35s both}
.token:hover{transform:translateY(-2px);background:#D6EAF8}
.token:active{cursor:grabbing}
.token.selected{background:var(--blue);color:white;box-shadow:0 4px 0 var(--ink)}
.token.stage-glow{outline:3px solid #8ED8FF;box-shadow:0 0 0 4px #D9F3FF,0 0 20px 7px #5DADE2;animation:stagePulse 1.35s infinite;z-index:2}
.drag-hint{display:none;position:absolute;left:calc(100% + 7px);top:50%;transform:translateY(-50%);white-space:nowrap;color:#2874a6;font:900 11px Arial;pointer-events:none;z-index:4;text-shadow:0 1px white}
.drag-hint.show{display:block;animation:arrowBounce .8s ease-in-out infinite}
@keyframes arrowBounce{0%,100%{transform:translate(0,-50%)}50%{transform:translate(5px,-50%)}}
@keyframes stagePulse{0%,100%{filter:brightness(1);box-shadow:0 0 0 3px #BFE6FF,0 0 12px 3px #5DADE2}50%{filter:brightness(1.08);box-shadow:0 0 0 6px #BFE6FF,0 0 25px 10px #5DADE2}}
.combine{margin-top:12px;min-height:64px;padding:12px;background:#EAF5FC;border:3px solid var(--ink);border-radius:16px;display:flex;justify-content:center;align-items:center;text-align:center;font:clamp(18px,3vw,25px) Georgia;gap:9px;flex-wrap:wrap}
.combine .equals{font-weight:bold}
.feedback{min-height:18px;text-align:center;font-size:12px;font-weight:bold;color:#2874a6;margin:9px 0 0}
.actions{display:flex;justify-content:center;gap:12px;margin-top:14px}
.action{font-weight:900;border:3px solid var(--ink);background:#5DADE2;color:white;border-radius:30px;box-shadow:0 4px 0 var(--ink);padding:10px 30px;cursor:pointer;font-size:14px;transition:.16s}
.action:hover{transform:translateY(-2px)}
.action.reset{background:white;color:var(--ink)}
.action.stage-glow{outline:4px solid #8ED8FF;box-shadow:0 0 0 5px #D9F3FF,0 0 24px 9px #5DADE2;animation:stagePulse 1.35s infinite}
/* Success dialog follows the reference page's green modal treatment. */
.level-modal-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(7,21,46,.28);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;padding:18px}
.level-modal-overlay.show{opacity:1;visibility:visible}
.level-modal-card{width:min(340px,100%);border:5px solid #ddd;border-radius:28px;background:white;padding:30px 28px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.24);transform:scale(.78) translateY(20px);transition:transform .38s cubic-bezier(.175,.885,.32,1.275)}
.level-modal-overlay.show .level-modal-card{transform:scale(1) translateY(0)}
.level-modal-card.success{border-color:var(--pass)}
.level-modal-icon{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:3rem;font-weight:950;background:var(--pass);box-shadow:0 0 20px rgba(32,164,100,.38)}
.level-modal-title{margin:0 0 12px;font-size:2rem;font-weight:950;color:var(--pass)}
.level-modal-answer{font:21px Georgia;margin:0 0 22px;color:var(--ink)}
.level-modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.level-modal-btn{border:0;border-radius:999px;padding:12px 25px;color:white;font-size:1rem;font-weight:950;cursor:pointer;background:var(--pass);box-shadow:0 5px 12px rgba(0,0,0,.15);transition:transform .18s ease,box-shadow .18s ease;white-space:nowrap;min-width:max-content}
.level-modal-btn:hover{transform:translateY(-3px);box-shadow:0 7px 16px rgba(0,0,0,.2)}
@keyframes choicesPop{0%{opacity:0;transform:translateX(28px) scale(.92) rotate(2deg)}72%{opacity:1;transform:translateX(-4px) scale(1.03) rotate(-1deg)}100%{opacity:1;transform:translateX(0) scale(1) rotate(0deg)}}
@media(max-width:640px){body{padding:17px 12px}.sources{grid-template-columns:1fr;gap:13px}.operator{justify-self:center;min-width:170px}.panel{padding:14px}.cross-table{border-spacing:5px}.cross-table .axis-corner{width:34%}.cross-table .axis-heading{height:42px;font-size:13px}.token-tray{gap:5px}.token{font-size:13px;padding:7px 2px}.drop-pair{gap:6px}.drop-slot{min-height:66px;padding:3px}.drop-slot .placed{font-size:14px;padding:7px 4px}.drag-hint{left:calc(100% + 3px);font-size:9px}.actions{gap:8px}.action{padding:10px 23px}.level-modal-card{padding:27px 20px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><div class="eyebrow">LEVEL 1 / 4</div><h1>BASIC STATES</h1></div>
  <a class="home" href="index.html">⌂ HOME</a>
</header>
<div class="progress"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>

<section class="sources">
  <article class="panel">
    <h2 class="panel-title">QUBIT A</h2>
    <div class="choices" id="a-choices"></div>
  </article>
  <div class="operator"><small>TENSOR PRODUCT</small><strong>⊗</strong></div>
  <article class="panel">
    <h2 class="panel-title">QUBIT B</h2>
    <div class="choices" id="b-choices"></div>
  </article>
</section>

<section class="panel table">
  <h2 class="table-head">CROSS-PRODUCT TABLE</h2>
  <table class="cross-table">
    <tbody>
      <tr>
        <td class="axis-corner">
          <div class="token-tray" id="token-tray">
            <span class="tray-empty">TOKENS</span>
          </div>
        </td>
        <th class="axis-heading">A₁ = 0 or 1</th>
      </tr>
      <tr>
        <th class="axis-heading">B₂ = 0 or 1</th>
        <td class="intersection" id="cell-22">
          <div class="drop-pair">
            <div class="drop-slot" id="slot-a">A₁</div>
            <div class="drop-slot" id="slot-b">B₂</div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="combine" id="result"><span>?</span><span>⊗</span><span>?</span><span class="equals">=</span><span>?</span></div>
  <div class="feedback" id="feedback"></div>
  <div class="actions">
    <button class="action" id="check" type="button">CHECK</button>
    <button class="action reset" id="reset" type="button">RESET</button>
  </div>
</section>
</main>

<div class="level-modal-overlay" id="success-modal" aria-hidden="true">
  <div class="level-modal-card success" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="level-modal-icon" aria-hidden="true">✓</div>
    <h2 class="level-modal-title" id="modal-title">Correct!</h2>
    <div class="level-modal-answer" id="success-answer">|0⟩ ⊗ |0⟩ = |00⟩₁₂</div>
    <div class="level-modal-actions">
      <button class="level-modal-btn" id="modal-ok" type="button">OK</button>
      <button class="level-modal-btn" id="modal-next" type="button">Next Level</button>
    </div>
  </div>
</div>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const states=[{value:0,ket:'|0⟩'},{value:1,ket:'|1⟩'}];
  let selectedA=null,selectedB=null,placedA=null,placedB=null,passed=false,stage=0;

  function renderSelectors(side){
    const host=$(side.toLowerCase()+'-choices');
    host.innerHTML='';
    states.forEach(state=>{
      const button=document.createElement('button');
      button.type='button';button.className='state';button.textContent=state.ket;
      button.addEventListener('click',()=>chooseState(side,state,button));
      host.appendChild(button);
    });
  }

  function chooseState(side,state,button){
    if(passed)return;
    if(side==='A'){
      selectedA=state;
      placedA=null;
      $('slot-a').textContent='A₁';
      $('slot-a').classList.remove('filled');
      removeToken('A');
      renderToken('A',state);
    }else{
      selectedB=state;
      placedB=null;
      $('slot-b').textContent='B₂';
      $('slot-b').classList.remove('filled');
      removeToken('B');
      renderToken('B',state);
    }
    $(side.toLowerCase()+'-choices').querySelectorAll('.state').forEach(el=>el.classList.toggle('active',el===button));
    $('feedback').textContent='';
    updateResult();
    updateStage();
  }

  function removeToken(side){
    const token=$(side==='A'?'token-a':'token-b');
    if(token)token.remove();
  }

  function renderToken(side,state){
    const tray=$('token-tray');
    $('tray-empty')?.remove();
    const token=document.createElement('button');
    token.type='button';token.draggable=true;token.className='token';
    token.id=side==='A'?'token-a':'token-b';
    token.textContent=(side==='A'?'A₁':'B₂')+' '+state.ket;
    const hint=document.createElement('span');
    hint.className='drag-hint';
    hint.textContent=side==='A'?'➜ DRAG TO A₁':'➜ DRAG TO B₂';
    token.appendChild(hint);
    const payload={side,value:state.value,ket:state.ket};

    // A click only reveals the direction hint; it never places the token or advances the stage.
    token.addEventListener('click',()=>{
      if(passed)return;
      document.querySelectorAll('.token').forEach(el=>{
        el.classList.remove('selected');
        el.querySelector('.drag-hint')?.classList.remove('show');
      });
      token.classList.add('selected');
      hint.classList.add('show');
    });
    token.addEventListener('dragstart',event=>{
      if(passed){event.preventDefault();return;}
      event.dataTransfer.setData('text/plain',JSON.stringify(payload));
      event.dataTransfer.effectAllowed='move';
      token.classList.add('selected');
      hint.classList.add('show');
    });
    token.addEventListener('dragend',()=>{
      token.classList.remove('selected');
      hint.classList.remove('show');
    });
    tray.appendChild(token);
  }

  function updateStage(){
    if(!selectedA)stage=0;
    else if(!selectedB)stage=1;
    else if(!placedA)stage=2;
    else if(!placedB)stage=3;
    else stage=4;
    setGlow();
  }

  function setGlow(){
    document.querySelectorAll('.stage-glow').forEach(el=>el.classList.remove('stage-glow'));
    $('slot-a').classList.remove('active-drop');
    $('slot-b').classList.remove('active-drop');
    if(passed)return;
    if(stage===0){
      $('a-choices').querySelectorAll('.state').forEach(el=>el.classList.add('stage-glow'));
    }else if(stage===1){
      $('b-choices').querySelectorAll('.state').forEach(el=>el.classList.add('stage-glow'));
    }else if(stage===2){
      $('token-a')?.classList.add('stage-glow');
      $('slot-a').classList.add('active-drop');
    }else if(stage===3){
      $('token-b')?.classList.add('stage-glow');
      $('slot-b').classList.add('active-drop');
    }else if(stage===4){
      $('check').classList.add('stage-glow');
    }
  }

  function fill(side,data){
    if(passed)return;
    if(side==='A'){
      if(data.side!=='A'||!selectedA)return;
      placedA=data;
      $('slot-a').innerHTML='<span class="placed">A₁ '+data.ket+'</span>';
      $('slot-a').classList.add('filled');
    }else{
      if(data.side!=='B'||!selectedB)return;
      placedB=data;
      $('slot-b').innerHTML='<span class="placed">B₂ '+data.ket+'</span>';
      $('slot-b').classList.add('filled');
    }
    document.querySelectorAll('.token').forEach(el=>{
      el.classList.remove('selected');
      el.querySelector('.drag-hint')?.classList.remove('show');
    });
    $('feedback').textContent='';
    updateResult();
    updateStage();
  }

  function setupDrop(id,side){
    const target=$(id);
    target.addEventListener('dragover',event=>{
      const canAccept=side==='A'?!!selectedA&&!placedA:!!selectedB&&!placedB;
      if(canAccept){event.preventDefault();event.dataTransfer.dropEffect='move';target.classList.add('active-drop');}
    });
    target.addEventListener('dragleave',()=>target.classList.remove('active-drop'));
    target.addEventListener('drop',event=>{
      event.preventDefault();target.classList.remove('active-drop');
      let data;
      try{data=JSON.parse(event.dataTransfer.getData('text/plain'));}catch{return;}
      if(data.side!==side){
        $('feedback').textContent=side==='A'?'This position is for A₁.':'This position is for B₂.';
        return;
      }
      fill(side,data);
    });
  }

  function updateResult(){
    const a=placedA?placedA.ket:'?';
    const b=placedB?placedB.ket:'?';
    const output=placedA&&placedB?'|'+placedA.value+placedB.value+'⟩₁₂':'?';
    $('result').innerHTML='<span>'+a+'</span><span>⊗</span><span>'+b+'</span><span class="equals">=</span><span>'+output+'</span>';
  }

  function showSuccess(){
    passed=true;
    $('success-answer').textContent=placedA.ket+' ⊗ '+placedB.ket+' = |'+placedA.value+placedB.value+'⟩₁₂';
    $('success-modal').classList.add('show');
    $('success-modal').setAttribute('aria-hidden','false');
    setGlow();
  }

  $('check').addEventListener('click',()=>{
    if(!placedA||!placedB){
      $('feedback').textContent='Please place both tokens in their correct positions.';
      return;
    }
    // The slot identity is the answer criterion. The selected quantum values can be 0 or 1.
    if(placedA.side==='A'&&placedB.side==='B')showSuccess();
  });

  function closeSuccess(){
    $('success-modal').classList.remove('show');
    $('success-modal').setAttribute('aria-hidden','true');
  }
  $('modal-ok').addEventListener('click',closeSuccess);
  $('success-modal').addEventListener('click',event=>{if(event.target===$('success-modal'))closeSuccess();});
  $('modal-next').addEventListener('click',()=>{window.location.href='level2.html';});

  $('reset').addEventListener('click',()=>{
    selectedA=null;selectedB=null;placedA=null;placedB=null;passed=false;
    $('slot-a').textContent='A₁';$('slot-b').textContent='B₂';
    $('slot-a').classList.remove('filled');$('slot-b').classList.remove('filled');
    $('token-a')?.remove();$('token-b')?.remove();
    $('token-tray').innerHTML='<span class="tray-empty" id="tray-empty">TOKENS</span>';
    $('a-choices').querySelectorAll('.state').forEach(el=>el.classList.remove('active'));
    $('b-choices').querySelectorAll('.state').forEach(el=>el.classList.remove('active'));
    $('feedback').textContent='';
    closeSuccess();
    updateResult();
    updateStage();
  });

  renderSelectors('A');
  renderSelectors('B');
  setupDrop('slot-a','A');
  setupDrop('slot-b','B');
  updateResult();
  updateStage();
})();
</script>
</body>
</html>
