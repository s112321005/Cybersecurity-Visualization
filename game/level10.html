<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="https://s112321005.github.io/Cybersecurity-Visualization/">
    <title>Polarization Basis - Level 10</title>
    <style>
        :root {
            --primary-blue: #549FD0;
            --ink: #263238;
            --bg-gradient: linear-gradient(135deg, #E0F2FE 0%, #F5F3FF 50%, #ECFDF5 100%);
            --muted: #667085;
            --paper: #ffffff;
            --line: #d7e3f5;
            --pass: #20a464;
            --block: #d94343;
            --zero: #99b3e5;
            --one: #3d7df2;
            --plus: #EBBA7C;
            --minus: #E8890A;
            --off: #9aa4b2;
            --unpolarized: #FACC15;
            --unpolarized-deep: #EAB308;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 34px 18px;
            background: var(--bg-gradient);
            color: var(--ink);
            margin: 0;
        }
        .header {
            width: min(1080px, 95vw);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 20px;
            animation: fadeIn 0.65s ease-out both;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .btn-back {
            width: 40px;
            height: 40px;
            background-color: var(--primary-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-back::before {
            content: "";
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 11px solid currentColor;
            margin-left: -2px;
        }
        .btn-back:hover { transform: scale(1.1); }
        .page-title {
            border: 2px solid var(--primary-blue);
            color: #07152e;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 800;
            background: white;
            white-space: nowrap;
        }
        .header-center { flex: 1; text-align: center; font-weight: 800; font-size: 1.15rem; }
        .main-card {
            width: min(1080px, 95vw);
            height: 710px;
            min-height: 710px;
            border: 3px solid var(--primary-blue);
            border-radius: 28px;
            position: relative;
            background: var(--paper);
            overflow: hidden;
            padding: 18px;
            animation: fadeIn 0.75s ease-out both;
        }
        .question { margin: 0 0 12px; color: #17345f; font-size: 1.18rem; line-height: 1.35; font-weight: 950; }

        /* 光子外觀樣式 */
        .tutorial-photon {
            position: relative;
            border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--beam-color) 72%, white);
            background: radial-gradient(circle, #ffffff 0 47%, color-mix(in srgb, var(--beam-color) 28%, transparent) 48% 54%, transparent 55% 100%);
            box-shadow: 0 0 18px color-mix(in srgb, var(--beam-color) 38%, transparent);
            display: grid;
            place-items: center;
            --beam-color: var(--one);
            --state-angle: 0deg;
        }
        .tutorial-photon::before {
            content: "";
            position: absolute;
            inset: 11px;
            border-radius: 50%;
            border: 6px solid color-mix(in srgb, var(--beam-color) 22%, white);
        }
        .tutorial-photon::after {
            content: attr(data-symbol);
            position: absolute;
            left: 50%;
            bottom: -25px;
            transform: translateX(-50%);
            color: #5b6470;
            font-size: 0.92rem;
            font-weight: 950;
        }
        .tutorial-photon.hide-symbol::after { display: none; }
        .tutorial-photon > span {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 48px;
            background: var(--beam-color);
            transform: translate(-50%, -50%) rotate(var(--state-angle));
            box-shadow: 0 0 10px var(--beam-color);
            clip-path: polygon(50% 0, 100% 18%, 72% 18%, 72% 82%, 100% 82%, 50% 100%, 0 82%, 28% 82%, 28% 18%, 0 18%);
            z-index: 2;
        }

        /* 無方向黃色光子（無虛線框） */
        .tutorial-photon.unpolarized {
            --beam-color: var(--unpolarized);
            background: radial-gradient(circle, #ffffff 0 42%, rgba(250, 204, 21, 0.28) 44% 66%, transparent 68% 100%);
            box-shadow: 0 0 22px rgba(250, 204, 21, 0.55);
        }
        .tutorial-photon.unpolarized::before {
            border-color: rgba(250, 204, 21, 0.35);
        }
        .tutorial-photon.unpolarized > span {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            clip-path: none;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffffff 0%, #fde047 55%, #eab308 100%);
            box-shadow: 0 0 14px rgba(250, 204, 21, 0.8);
        }

        .choice-photon { width: 82px; height: 82px; margin: 4px auto 8px; }
        .level-three-card { height: 710px; min-height: 710px; }
        .level-three-shell {
            display: grid;
            grid-template-columns: minmax(560px, 1fr) 320px;
            gap: 18px;
            height: 100%;
            min-height: 0;
        }
        .level-three-panel {
            border: 5px solid var(--ink);
            border-radius: 24px;
            background: radial-gradient(circle at 20% 18%, rgba(255, 216, 77, 0.22), transparent 28%),
                        radial-gradient(circle at 86% 78%, rgba(229, 93, 139, 0.16), transparent 30%),
                        #fbfdff;
            padding: 18px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 10px 10px 0 color-mix(in srgb, var(--primary-blue) 52%, white);
        }
        .level-three-panel.ready { animation: choicesPop 0.36s ease-out both; }
        .level-badge-static {
            align-self: flex-start;
            border: 4px solid var(--ink);
            border-radius: 999px;
            background: #ffffff;
            color: var(--ink);
            padding: 10px 16px;
            font-weight: 950;
            box-shadow: 0 6px 0 var(--primary-blue);
            margin-bottom: 14px;
        }
        .level-three-options { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 16px 0; }
        .option-tile {
            appearance: none;
            border: 5px solid var(--ink);
            border-radius: 32px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fcff 100%);
            color: #263238;
            min-height: 178px;
            padding: 14px;
            font-weight: 950;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            box-shadow: 0 8px 0 var(--primary-blue), 0 16px 24px rgba(31, 67, 107, 0.1);
            position: relative;
            top: 0;
            transition: transform 0.16s ease, box-shadow 0.16s ease, top 0.12s ease, background 0.16s ease;
        }
        .option-tile strong { display: block; color: var(--ink); font-size: 1.12rem; font-weight: 950; margin-bottom: 12px; }
        .option-tile:hover {
            transform: translateY(-5px) rotate(-2deg) scale(1.03);
            box-shadow: 0 13px 0 var(--primary-blue), 0 20px 30px rgba(31, 67, 107, 0.14);
        }
        .option-tile:active { top: 5px; box-shadow: 0 3px 0 var(--primary-blue), 0 8px 18px rgba(31, 67, 107, 0.1); }
        .option-tile.active { background: #edf5ff; box-shadow: 0 8px 0 #f0a92d, 0 14px 24px rgba(0, 74, 173, 0.14); }
        .option-tile.correct { background: #f0fff5; box-shadow: 0 8px 0 var(--pass), 0 14px 24px rgba(32, 164, 100, 0.14); }
        .option-tile.wrong { background: #fff3f3; box-shadow: 0 8px 0 var(--block), 0 14px 24px rgba(217, 67, 67, 0.14); }
        .option-tile:disabled { cursor: default; }

        .block-choice-icon {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 5px solid #111111;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 18px rgba(17, 17, 17, 0.12);
        }
        .block-choice-icon::before, .block-choice-icon::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 9px;
            height: 66px;
            border-radius: 999px;
            background: #111111;
            box-shadow: 0 0 12px rgba(17, 17, 17, 0.18);
        }
        .block-choice-icon::before { transform: translate(-50%, -50%) rotate(45deg); }
        .block-choice-icon::after { transform: translate(-50%, -50%) rotate(-45deg); }

        .next-level-btn {
            margin-top: auto;
            appearance: none;
            border: 5px solid var(--ink);
            border-radius: 999px;
            background: var(--primary-blue);
            color: white;
            min-height: 58px;
            padding: 12px 18px;
            font-weight: 950;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 16px 24px rgba(31, 67, 107, 0.1);
            position: relative;
            top: 0;
            transition: transform 0.16s ease, box-shadow 0.16s ease, top 0.12s ease;
        }
        .next-level-btn.hidden { display: none; }
        .next-level-btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 0 var(--ink), 0 20px 30px rgba(31, 67, 107, 0.14); }
        .next-level-btn:active { top: 5px; box-shadow: 0 3px 0 var(--ink), 0 8px 18px rgba(31, 67, 107, 0.1); }

        /* 舞台與雙偏振片佈局 */
        .level-three-stage {
            position: relative;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            border: 5px solid var(--ink);
            border-radius: 24px;
            background: linear-gradient(90deg, rgba(0, 74, 173, 0.06) 1px, transparent 1px),
                        linear-gradient(180deg, rgba(0, 74, 173, 0.05) 1px, transparent 1px),
                        #ffffff;
            background-size: 42px 42px, 42px 42px, auto;
            box-shadow: 10px 10px 0 color-mix(in srgb, #23a9a5 38%, white);
        }
        .level-three-scene {
            position: absolute;
            left: 44px;
            right: 44px;
            top: 40%;
            height: 160px;
            transform: translateY(-50%);
            --filter-1: 38%;
            --filter-2: 66%;
        }
        .level-three-scene .tutorial-photon {
            position: absolute;
            left: 0;
            top: 50%;
            width: 92px;
            height: 92px;
            transform: translateY(-50%);
            z-index: 6;
        }

        /* 第一段光束（黃色，位於偏振片圖片後方 z-index: 4） */
        .level-three-beam {
            position: absolute;
            left: 64px;
            width: calc(var(--filter-1) - 64px);
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, var(--unpolarized-deep), var(--unpolarized));
            opacity: 0;
            z-index: 4;
        }
        .intro-animation .level-three-beam { animation: levelThreeBeamIntro 1.5s linear forwards; }
        .finish-animation .level-three-beam { opacity: 0.9; }

        /* 第二段中間光束（藍色，位於兩片偏振片圖片後方 z-index: 4） */
        .level-three-beam-mid {
            position: absolute;
            left: var(--filter-1);
            width: calc(var(--filter-2) - var(--filter-1));
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, var(--one), var(--one));
            opacity: 0;
            z-index: 4;
        }
        .will-block .finish-animation .level-three-beam-mid {
            animation: midBeamPass 0.65s linear forwards;
        }

        /* 移動中的光子亮點（一開始為黃色，位於偏振片圖片後方 z-index: 5） */
        .level-three-dot {
            position: absolute;
            left: 46px;
            top: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            background: var(--unpolarized);
            box-shadow: 0 0 18px var(--unpolarized-deep), 0 0 30px color-mix(in srgb, var(--unpolarized) 65%, transparent);
            opacity: 0;
            z-index: 5;
        }
        .intro-animation .level-three-dot { animation: dualFilterIntro 1.5s linear forwards; }
        .will-block .finish-animation .level-three-dot { animation: dualFilterBlock 1.35s linear forwards; }

        /* 雙偏振片圖片（z-index: 11，覆蓋在光束線條上方） */
        .level-filter {
            position: absolute;
            left: var(--filter-1);
            top: 50%;
            width: 132px;
            transform: translate(-50%, -49%);
            z-index: 11;
        }
        .level-filter img { width: 100%; height: auto; display: block; }
        .level-filter.second {
            left: var(--filter-2);
            width: 132px;
        }

        /* 偏振片上方的 Z-Basis 標籤 */
        .filter-basis-tag {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 4px 11px;
            border: 3px solid var(--ink);
            border-radius: 999px;
            background: #eef6ff;
            color: #17345f;
            font-size: 0.78rem;
            font-weight: 950;
            box-shadow: 0 4px 0 var(--primary-blue);
        }

        /* 通過第一片 Z 基底後的中間量子態提示 */
        .mid-state-tag {
            position: absolute;
            left: calc((var(--filter-1) + var(--filter-2)) / 2);
            top: calc(50% - 34px);
            transform: translate(-50%, -50%) scale(0.75);
            white-space: nowrap;
            padding: 3px 9px;
            border: 2.5px solid var(--ink);
            border-radius: 999px;
            background: #eff6ff;
            color: var(--one);
            font-size: 0.76rem;
            font-weight: 950;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }
        .will-block .finish-animation .mid-state-tag {
            animation: midStatePop 0.35s ease-out 0.25s forwards;
        }

        /* 右側結果框與百分比 */
        .result-placeholder {
            position: absolute;
            left: calc(100% - 64px);
            top: 50%;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px dashed rgba(38, 50, 56, 0.82);
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
            pointer-events: none;
        }
        .certainty-label {
            position: absolute;
            left: calc(100% - 64px);
            top: calc(50% - 82px);
            transform: translate(-50%, -50%) scale(0.7);
            min-width: 74px;
            padding: 6px 12px;
            border: 4px solid var(--ink);
            border-radius: 999px;
            background: #ffffff;
            color: #5f6673;
            font-size: 1rem;
            font-weight: 950;
            text-align: center;
            box-shadow: 0 6px 0 #5f6673, 0 12px 20px rgba(31, 67, 107, 0.12);
            opacity: 0;
            z-index: 13;
            pointer-events: none;
        }
        .will-block .finish-animation .certainty-label {
            animation: certaintyPop 0.35s ease-out 1.05s forwards;
        }

        .level-block-mark {
            position: absolute;
            left: calc(100% - 64px);
            top: 50%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 5px solid #111111;
            transform: translate(-50%, -50%) scale(0.35);
            opacity: 0;
            z-index: 9;
            background: rgba(255, 255, 255, 0.7);
        }
        .level-block-mark::before, .level-block-mark::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 9px;
            height: 58px;
            border-radius: 999px;
            background: #111111;
        }
        .level-block-mark::before { transform: translate(-50%, -50%) rotate(45deg); }
        .level-block-mark::after { transform: translate(-50%, -50%) rotate(-45deg); }
        .will-block .finish-animation .level-block-mark {
            animation: levelBlockPop 0.45s ease-out 0.85s forwards;
        }

        /* 彈窗樣式 */
        .level-modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7, 21, 46, 0.28);
            backdrop-filter: blur(4px);
            border-radius: 19px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .level-modal-overlay.show { opacity: 1; visibility: visible; }
        .level-modal-card {
            width: min(420px, 88%);
            border: 5px solid #ddd;
            border-radius: 28px;
            background: white;
            padding: 28px 26px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.24);
            transform: scale(0.78) translateY(20px);
            transition: transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .level-modal-overlay.show .level-modal-card { transform: scale(1) translateY(0); }
        .level-modal-card.success { border-color: var(--pass); }
        .level-modal-card.error { border-color: var(--block); }
        .level-modal-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: 950;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }
        .level-modal-card.success .level-modal-icon { background: var(--pass); box-shadow: 0 0 20px rgba(32, 164, 100, 0.38); }
        .level-modal-card.error .level-modal-icon { background: var(--block); box-shadow: 0 0 20px rgba(217, 67, 67, 0.38); }
        .level-modal-title { margin: 0 0 12px; font-size: 2rem; font-weight: 950; }
        .level-modal-card.success .level-modal-title { color: var(--pass); }
        .level-modal-card.error .level-modal-title { color: var(--block); }
        .level-modal-desc {
            margin: 0 0 22px;
            padding: 12px 14px;
            border-radius: 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: left;
        }
        .level-modal-desc strong { color: #0f172a; }
        .level-modal-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: nowrap; }
        .level-modal-btn {
            border: 0;
            border-radius: 999px;
            padding: 12px 34px;
            color: white;
            font-size: 1rem;
            font-weight: 950;
            cursor: pointer;
            background: var(--primary-blue);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            white-space: nowrap;
            min-width: max-content;
        }
        .level-modal-card.success .level-modal-btn { background: var(--pass); }
        .level-modal-card.error .level-modal-btn { background: var(--block); }
        .level-modal-card.success .level-modal-btn.secondary { background: var(--pass) !important; color: white; border: 0; }
        .level-modal-card.error .level-modal-btn.secondary { background: #c8cbcf !important; color: #000000; border: 3px solid #a9b0b9; }
        .level-modal-btn:hover { transform: translateY(-3px); box-shadow: 0 7px 16px rgba(0, 0, 0, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes dualFilterIntro {
            0% { left: 46px; transform: scale(0.7); opacity: 0; }
            12% { opacity: 1; }
            85% { left: calc(var(--filter-1) - 8px); transform: scale(1); opacity: 1; }
            100% { left: var(--filter-1); transform: scale(1.05); opacity: 1; }
        }
        @keyframes dualFilterBlock {
            0% {
                left: var(--filter-1);
                transform: scale(1.05);
                opacity: 1;
                background: var(--one);
                box-shadow: 0 0 18px var(--one), 0 0 30px color-mix(in srgb, var(--one) 52%, transparent);
            }
            48% {
                left: var(--filter-2);
                transform: scale(1.1);
                opacity: 1;
                background: var(--one);
                box-shadow: 0 0 18px var(--one), 0 0 30px color-mix(in srgb, var(--one) 52%, transparent);
            }
            72% {
                left: var(--filter-2);
                transform: scale(1.15);
                opacity: 0.85;
                background: var(--block);
                box-shadow: 0 0 18px var(--block);
            }
            100% {
                left: var(--filter-2);
                transform: scale(0.08);
                opacity: 0;
            }
        }
        @keyframes levelThreeBeamIntro {
            0%, 18% { opacity: 0.32; }
            50%, 100% { opacity: 0.9; }
        }
        @keyframes midBeamPass {
            0% { opacity: 0; }
            30%, 100% { opacity: 0.85; }
        }
        @keyframes midStatePop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes levelBlockPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
            72% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes certaintyPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7) rotate(-3deg); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        @keyframes choicesPop {
            0% { opacity: 0; transform: translateX(28px) scale(0.92) rotate(2deg); }
            72% { opacity: 1; transform: translateX(-4px) scale(1.03) rotate(-1deg); }
            100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
        }
        @media (max-width: 1180px) {
            .level-three-card { height: auto; min-height: auto; }
            .level-three-shell { grid-template-columns: 1fr; }
            .level-three-stage { min-height: 520px; }
        }
        @media (max-width: 640px) {
            body { padding: 18px 10px; }
            .page-title { padding: 9px 14px; font-size: 17px; }
            .header-center { font-size: 1rem; }
            .main-card { padding: 12px; border-radius: 20px; }
            .level-three-scene { left: 20px; right: 20px; }
            .level-three-scene .tutorial-photon { width: 72px; height: 72px; }
            .level-filter, .level-filter.second { width: 96px; }
            .filter-basis-tag { font-size: 0.68rem; padding: 3px 8px; top: -30px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="game/index.html" class="btn-back" title="Back to levels"></a>
            <div class="page-title">Level 10</div>
        </div>
        <div class="header-center">Photon Direction & Polarizer Game</div>
    </div>
    <main class="main-card" data-level-page="10"></main>
    <script>
const photonTypes = {
    unpolarized: { symbol: "?", label: "unpolarized light", angle: "0deg", color: "var(--unpolarized)" },
    vertical: { symbol: "1", label: "vertical light", angle: "0deg", color: "var(--one)" },
    horizontal: { symbol: "0", label: "horizontal light", angle: "90deg", color: "var(--zero)" },
    diagRight: { symbol: "+", label: "right diagonal light", angle: "45deg", color: "var(--plus)" },
    diagLeft: { symbol: "-", label: "left diagonal light", angle: "-45deg", color: "var(--minus)" }
};

const filterTypes = {
    vertical: { label: "Vertical", basis: "Z-Basis", state: "|1⟩", image: "pictures/vertical.svg" },
    horizontal: { label: "Horizontal", basis: "Z-Basis", state: "|0⟩", image: "pictures/horizontal.svg" }
};

const level = {
    photon: "unpolarized",
    filters: ["vertical", "horizontal"],
    pass: "block",
    output: "none"
};

const page = document.querySelector("[data-level-page]");
const levelIndex = Math.max(0, Number(page.dataset.levelPage || 1) - 1);
const levelFiles = [
    "game/level1.html",
    "game/level2.html",
    "game/level3.html",
    "game/level4.html",
    "game/level5.html",
    "game/level6.html",
    "game/level7.html",
    "game/level8.html",
    "game/level9.html",
    "game/level10.html",
    "game/level11.html"
];

function photonMarkup(id = "", extraClass = "") {
    return `<div class="tutorial-photon ${extraClass}" ${id ? `id="${id}"` : ""}><span></span></div>`;
}

function setPhoton(el, state) {
    const photon = photonTypes[state];
    el.dataset.symbol = photon.symbol;
    el.style.setProperty("--beam-color", photon.color);
    el.style.setProperty("--state-angle", photon.angle);
}

function renderLevel() {
    const levelNo = levelIndex + 1;
    const correctAnswer = "none";
    const filtersMarkup = level.filters.map((filterName, index) => {
        const filter = filterTypes[filterName];
        return `
            <div class="level-filter ${index > 0 ? "second" : ""}">
                <span class="filter-basis-tag">${filter.basis} · ${filter.state}</span>
                <img src="${filter.image}" alt="${filter.label}">
            </div>`;
    }).join("");

    page.classList.add("level-three-card");
    page.innerHTML = `
        <section class="level-three-shell">
            <section class="level-three-stage will-block">
                <div class="level-three-scene">
                    ${photonMarkup("levelPhoton", "unpolarized hide-symbol")}
                    <div class="level-three-beam"></div>
                    <div class="level-three-beam-mid"></div>
                    <div class="level-three-dot"></div>
                    <span class="mid-state-tag">|1⟩ (Z)</span>
                    <span class="result-placeholder"></span>
                    <span class="certainty-label">0%</span>
                    ${filtersMarkup}
                    <span class="level-block-mark"></span>
                </div>
                <div class="level-modal-overlay" id="levelResultModal">
                    <div class="level-modal-card" id="levelModalCard">
                        <div class="level-modal-icon" id="levelModalIcon">!</div>
                        <h2 class="level-modal-title" id="levelModalTitle">Correct!</h2>
                        <p class="level-modal-desc" id="levelModalDesc"></p>
                        <div class="level-modal-actions">
                            <button class="level-modal-btn" id="levelModalBtn" type="button">OK</button>
                            <button class="level-modal-btn secondary hidden" id="levelModalSecondaryBtn" type="button">Give up</button>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="level-three-panel ready" id="levelPanel">
                <div class="level-badge-static">Level ${levelNo}</div>
                <h1 class="question">Final result?</h1>
                <div class="level-three-options">
                    <button class="option-tile" type="button" data-answer="horizontal" aria-label="horizontal light passes">
                        <strong>HORIZONTAL · |0⟩ (Z)</strong>
                        ${photonMarkup("", "choice-photon hide-symbol")}
                    </button>
                    <button class="option-tile" type="button" data-answer="none" aria-label="blocked">
                        <strong>BLOCK</strong>
                        <span class="block-choice-icon"></span>
                    </button>
                </div>
                <button class="next-level-btn hidden" id="nextLevelBtn" type="button">Next Level</button>
            </aside>
        </section>
    `;

    setPhoton(document.getElementById("levelPhoton"), "unpolarized");
    document.querySelectorAll(".choice-photon").forEach((el) => setPhoton(el, "horizontal"));

    let selected = null;
    let isAnimating = false;
    let isReady = false;
    let introTimer = null;
    let delayTimer = null;
    let resultTimer = null;
    let lastCorrect = false;

    const scene = document.querySelector(".level-three-scene");
    const panel = document.getElementById("levelPanel");
    const levelResultModal = document.getElementById("levelResultModal");
    const levelModalCard = document.getElementById("levelModalCard");
    const levelModalIcon = document.getElementById("levelModalIcon");
    const levelModalTitle = document.getElementById("levelModalTitle");
    const levelModalDesc = document.getElementById("levelModalDesc");
    const levelModalBtn = document.getElementById("levelModalBtn");
    const levelModalSecondaryBtn = document.getElementById("levelModalSecondaryBtn");
    const nextLevelBtn = document.getElementById("nextLevelBtn");

    function setOptionDisabled(disabled) {
        document.querySelectorAll(".option-tile").forEach((item) => {
            item.disabled = disabled;
        });
    }

    function startIntro() {
        selected = null;
        lastCorrect = false;
        isReady = false;
        isAnimating = true;
        setOptionDisabled(true);
        levelResultModal.classList.remove("show");
        nextLevelBtn.classList.add("hidden");
        scene.classList.remove("intro-animation", "finish-animation");
        document.querySelectorAll(".option-tile").forEach((item) => {
            item.classList.remove("active", "correct", "wrong");
        });
        void scene.offsetWidth;
        scene.classList.add("intro-animation");
        introTimer = window.setTimeout(() => {
            isReady = true;
            isAnimating = false;
            panel.classList.add("ready");
            setOptionDisabled(false);
        }, 1600);
    }

    function showResultModal(correct) {
        levelModalCard.className = `level-modal-card ${correct ? "success" : "error"}`;
        levelModalIcon.innerHTML = correct ? "&#10003;" : "!";
        levelModalTitle.textContent = correct ? "Correct!" : "Incorrect!";
        levelModalDesc.innerHTML = correct
            ? "光子先經 <strong>Z 基底（|1⟩ 垂直）</strong> 偏振片極化，再遇到同屬 <strong>Z 基底的正交方向（|0⟩ 水平）</strong>，因兩態完全正交而 100% 阻擋（0%）。<br><span style='color:#64748b;font-size:0.85rem;'>💡 提示：若在兩者之間改放 <strong>X 基底（|+⟩ / |−⟩ 對角）</strong> 偏振片，光子重新投影後反而會有一部分通過！</span>"
            : "再想一下：第一片偏振片已將光子固定在 <strong>Z 基底的 |1⟩（垂直）</strong> 狀態，接著遇到同樣屬於 <strong>Z 基底的 |0⟩（水平）</strong> 偏振片，兩者彼此正交，光線能否通過？";
        levelModalBtn.textContent = correct ? "OK" : "Try again";
        levelModalSecondaryBtn.textContent = correct ? "Next Level" : "Give up";
        levelModalBtn.style.order = correct ? "1" : "2";
        levelModalSecondaryBtn.style.order = correct ? "2" : "1";
        levelModalSecondaryBtn.classList.remove("hidden");
        levelResultModal.classList.add("show");
    }

    function returnToChoice() {
        if (lastCorrect) {
            levelResultModal.classList.remove("show");
            return;
        }
        if (introTimer) window.clearTimeout(introTimer);
        if (delayTimer) window.clearTimeout(delayTimer);
        if (resultTimer) window.clearTimeout(resultTimer);
        introTimer = null;
        delayTimer = null;
        resultTimer = null;
        levelResultModal.classList.remove("show");
        startIntro();
    }

    document.querySelectorAll(".option-tile").forEach((btn) => {
        btn.addEventListener("click", () => {
            if (isAnimating || !isReady) return;
            selected = btn.dataset.answer;
            isAnimating = true;
            isReady = false;
            document.querySelectorAll(".option-tile").forEach((item) => {
                item.classList.toggle("active", item === btn);
            });
            setOptionDisabled(true);
            scene.classList.remove("finish-animation");

            const correctNow = selected === correctAnswer;
            if (!correctNow) {
                lastCorrect = false;
                btn.classList.add("wrong");
                nextLevelBtn.classList.add("hidden");
                showResultModal(false);
                isAnimating = false;
                return;
            }

            delayTimer = window.setTimeout(() => {
                void scene.offsetWidth;
                scene.classList.add("finish-animation");
                resultTimer = window.setTimeout(() => {
                    lastCorrect = true;
                    document.querySelectorAll(".option-tile").forEach((item) => {
                        item.classList.toggle("correct", item.dataset.answer === correctAnswer);
                        item.classList.toggle("wrong", false);
                    });
                    nextLevelBtn.classList.remove("hidden");
                    showResultModal(true);
                    isAnimating = false;
                }, 1500);
            }, 350);
        });
    });

    levelModalBtn.addEventListener("click", returnToChoice);
    levelModalSecondaryBtn.addEventListener("click", () => {
        window.location.href = lastCorrect ? (levelFiles[levelIndex + 1] || "game/index.html") : "game/index.html";
    });
    nextLevelBtn.addEventListener("click", () => {
        window.location.href = levelFiles[levelIndex + 1] || "game/index.html";
    });

    startIntro();
}

renderLevel();
    </script>
</body>
</html>
