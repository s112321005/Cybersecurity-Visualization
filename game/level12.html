<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="https://s112321005.github.io/Cybersecurity-Visualization/">
    <title>Polarization Basis - Level 12</title>
    <style>
        :root {
            --primary-blue: #549FD0;
            --ink: #263238;
            --bg-gradient: linear-gradient(135deg, #E0F2FE 0%, #F5F3FF 50%, #ECFDF5 100%);
            --paper: #ffffff;
            --pass: #20a464;
            --block: #d94343;
            --zero: #99b3e5;
            --one: #3d7df2;
            --plus: #EBBA7C;
            --minus: #E8890A;
            --unpolarized: #FACC15;
            --unpolarized-deep: #EAB308;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 34px 18px;
            background: var(--bg-gradient);
            color: var(--ink);
            margin: 0;
        }
        .header {
            width: min(1080px, 95vw);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 20px;
            animation: fadeIn 0.65s ease-out both;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .btn-back {
            width: 40px;
            height: 40px;
            background-color: var(--primary-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-back::before {
            content: "";
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 11px solid currentColor;
            margin-left: -2px;
        }
        .btn-back:hover { transform: scale(1.1); }
        .page-title {
            border: 2px solid var(--primary-blue);
            color: #07152e;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 800;
            background: white;
            white-space: nowrap;
        }
        .header-center { flex: 1; text-align: center; font-weight: 800; font-size: 1.15rem; }
        .main-card {
            width: min(1080px, 95vw);
            height: 710px;
            min-height: 710px;
            border: 3px solid var(--primary-blue);
            border-radius: 28px;
            position: relative;
            background: var(--paper);
            overflow: hidden;
            padding: 18px;
            animation: fadeIn 0.75s ease-out both;
        }
        .question { margin: 0 0 8px; color: #17345f; font-size: 1.15rem; line-height: 1.3; font-weight: 950; }

        /* 光子外觀樣式 */
        .tutorial-photon {
            position: relative;
            border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--beam-color) 72%, white);
            background: radial-gradient(circle, #ffffff 0 47%, color-mix(in srgb, var(--beam-color) 28%, transparent) 48% 54%, transparent 55% 100%);
            box-shadow: 0 0 18px color-mix(in srgb, var(--beam-color) 38%, transparent);
            display: grid;
            place-items: center;
            --beam-color: var(--zero);
            --state-angle: 90deg;
        }
        .tutorial-photon::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 5px solid color-mix(in srgb, var(--beam-color) 22%, white);
        }
        .tutorial-photon::after {
            content: attr(data-symbol);
            position: absolute;
            left: 50%;
            bottom: -25px;
            transform: translateX(-50%);
            color: #5b6470;
            font-size: 0.92rem;
            font-weight: 950;
        }
        .tutorial-photon.hide-symbol::after { display: none; }
        .tutorial-photon > span {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 14px;
            height: 44px;
            background: var(--beam-color);
            transform: translate(-50%, -50%) rotate(var(--state-angle));
            box-shadow: 0 0 10px var(--beam-color);
            clip-path: polygon(50% 0, 100% 18%, 72% 18%, 72% 82%, 100% 82%, 50% 100%, 0 82%, 28% 82%, 28% 18%, 0 18%);
            z-index: 2;
        }

        /* 無方向黃色光子 */
        .tutorial-photon.unpolarized {
            --beam-color: var(--unpolarized);
            border: 3px solid var(--unpolarized-deep);
            background: radial-gradient(circle, #ffffff 0 42%, rgba(250, 204, 21, 0.28) 44% 66%, transparent 68% 100%);
            box-shadow: 0 0 22px rgba(250, 204, 21, 0.55);
        }
        .tutorial-photon.unpolarized::before {
            border-color: rgba(250, 204, 21, 0.35);
        }
        .tutorial-photon.unpolarized > span {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            clip-path: none;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffffff 0%, #fde047 55%, #eab308 100%);
            box-shadow: 0 0 14px rgba(250, 204, 21, 0.8);
        }

        /* 參考 Level 9 的四宮格選項卡片與右側面板 */
        .choice-photon { width: 64px; height: 64px; margin: 0 auto; }
        .choice-photon::before { inset: 8px; border-width: 4px; }
        .choice-photon > span { width: 12px; height: 36px; }

        .level-three-card { height: 710px; min-height: 710px; }
        .level-three-shell {
            display: grid;
            grid-template-columns: minmax(560px, 1fr) 320px;
            gap: 18px;
            height: 100%;
            min-height: 0;
        }
        .level-three-panel {
            border: 5px solid var(--ink);
            border-radius: 24px;
            background: radial-gradient(circle at 20% 18%, rgba(255, 216, 77, 0.22), transparent 28%),
                        radial-gradient(circle at 86% 78%, rgba(229, 93, 139, 0.16), transparent 30%),
                        #fbfdff;
            padding: 16px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 10px 10px 0 color-mix(in srgb, var(--primary-blue) 52%, white);
        }
        .level-three-panel.ready { animation: choicesPop 0.36s ease-out both; }
        .level-badge-static {
            align-self: flex-start;
            border: 4px solid var(--ink);
            border-radius: 999px;
            background: #ffffff;
            color: var(--ink);
            padding: 8px 15px;
            font-weight: 950;
            box-shadow: 0 6px 0 var(--primary-blue);
            margin-bottom: 10px;
        }

        /* 上方 4 個方向/Block 選項（參考 Level 9 的 2x2 網格） */
        .level-three-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 6px 0 12px;
        }
        .option-tile {
            appearance: none;
            border: 5px solid var(--ink);
            border-radius: 28px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fcff 100%);
            color: #263238;
            min-height: 124px;
            padding: 10px 8px;
            font-weight: 950;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 7px 0 var(--primary-blue), 0 14px 20px rgba(31, 67, 107, 0.1);
            position: relative;
            top: 0;
            transition: transform 0.16s ease, box-shadow 0.16s ease, top 0.12s ease, background 0.16s ease;
        }
        .option-tile strong {
            display: block;
            color: var(--ink);
            font-size: 0.98rem;
            font-weight: 950;
            margin: 0;
        }
        .option-tile:hover:not(:disabled) {
            transform: translateY(-4px) rotate(-1.5deg) scale(1.03);
            box-shadow: 0 11px 0 var(--primary-blue), 0 18px 26px rgba(31, 67, 107, 0.14);
        }
        .option-tile:active:not(:disabled) { top: 4px; box-shadow: 0 3px 0 var(--primary-blue), 0 8px 18px rgba(31, 67, 107, 0.1); }
        .option-tile.active { background: #edf5ff; box-shadow: 0 7px 0 var(--plus), 0 14px 22px rgba(0, 74, 173, 0.14); }
        .option-tile.correct { background: #f0fff5; box-shadow: 0 7px 0 var(--pass), 0 14px 22px rgba(32, 164, 100, 0.14); }
        .option-tile.wrong { background: #fff3f3; box-shadow: 0 7px 0 var(--block), 0 14px 22px rgba(217, 67, 67, 0.14); }
        .option-tile:disabled { cursor: default; }

        .block-choice-icon {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4.5px solid #111111;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 14px rgba(17, 17, 17, 0.12);
        }
        .block-choice-icon::before, .block-choice-icon::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 50px;
            border-radius: 999px;
            background: #111111;
        }
        .block-choice-icon::before { transform: translate(-50%, -50%) rotate(45deg); }
        .block-choice-icon::after { transform: translate(-50%, -50%) rotate(-45deg); }

        /* 下方 3 個百分比選項（50%、25%、12.5%） */
        .percent-section {
            margin-top: 2px;
        }
        .percent-section-label {
            margin: 0 0 8px;
            font-size: 0.9rem;
            font-weight: 950;
            color: #475569;
        }
        .percent-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }
        .percent-tile {
            appearance: none;
            border: 4px solid var(--ink);
            border-radius: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fcff 100%);
            color: var(--ink);
            min-height: 54px;
            padding: 8px 4px;
            font-size: 0.98rem;
            font-weight: 950;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-blue), 0 10px 18px rgba(31, 67, 107, 0.08);
            position: relative;
            top: 0;
            transition: transform 0.15s ease, box-shadow 0.15s ease, top 0.12s ease, background 0.15s ease, opacity 0.15s ease;
        }
        .percent-tile:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 9px 0 var(--primary-blue), 0 14px 22px rgba(31, 67, 107, 0.12);
        }
        .percent-tile:active:not(:disabled) {
            top: 4px;
            box-shadow: 0 2px 0 var(--primary-blue);
        }
        .percent-tile.active {
            background: #edf5ff;
            box-shadow: 0 6px 0 var(--plus), 0 12px 20px rgba(0, 74, 173, 0.14);
        }
        .percent-tile.correct {
            background: #f0fff5;
            box-shadow: 0 6px 0 var(--pass), 0 12px 20px rgba(32, 164, 100, 0.14);
            color: #14532d;
        }
        .percent-tile.wrong {
            background: #fff3f3;
            box-shadow: 0 6px 0 var(--block), 0 12px 20px rgba(217, 67, 67, 0.14);
            color: #7f1d1d;
        }
        .percent-tile:disabled {
            cursor: default;
            opacity: 0.45;
        }

        .next-level-btn {
            margin-top: auto;
            appearance: none;
            border: 5px solid var(--ink);
            border-radius: 999px;
            background: var(--pass);
            color: white;
            min-height: 54px;
            padding: 10px 18px;
            font-weight: 950;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 16px 24px rgba(31, 67, 107, 0.1);
            position: relative;
            top: 0;
            transition: transform 0.16s ease, box-shadow 0.16s ease, top 0.12s ease;
        }
        .next-level-btn.hidden { display: none; }
        .next-level-btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 0 var(--ink), 0 20px 30px rgba(31, 67, 107, 0.14); }
        .next-level-btn:active { top: 5px; box-shadow: 0 3px 0 var(--ink), 0 8px 18px rgba(31, 67, 107, 0.1); }

        /* 舞台與三片偏振片佈局 */
        .level-three-stage {
            position: relative;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            border: 5px solid var(--ink);
            border-radius: 24px;
            background: linear-gradient(90deg, rgba(0, 74, 173, 0.06) 1px, transparent 1px),
                        linear-gradient(180deg, rgba(0, 74, 173, 0.05) 1px, transparent 1px),
                        #ffffff;
            background-size: 42px 42px, 42px 42px, auto;
            box-shadow: 10px 10px 0 color-mix(in srgb, #23a9a5 38%, white);
        }
        .level-three-scene {
            position: absolute;
            left: 28px;
            right: 28px;
            top: 44%;
            height: 160px;
            transform: translateY(-50%);
            --filter-1: 27%;
            --filter-2: 49%;
            --filter-3: 71%;
            --target-x: calc(100% - 48px);
        }
        .level-three-scene #levelPhoton {
            position: absolute;
            left: 0;
            top: 50%;
            width: 82px;
            height: 82px;
            transform: translateY(-50%);
            z-index: 6;
        }

        /* 第一段光束（黃色無偏振，z-index: 4） */
        .level-three-beam {
            position: absolute;
            left: 52px;
            width: calc(var(--filter-1) - 52px);
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, var(--unpolarized-deep), var(--unpolarized));
            opacity: 0;
            z-index: 4;
        }
        .intro-animation .level-three-beam { animation: beamIntro 1.4s linear forwards; }
        .finish-animation .level-three-beam,
        .loop-animation .level-three-beam { opacity: 0.9; }

        /* 第二段光束（第1片到第2片：藍色 Z |1⟩，z-index: 4） */
        .level-three-beam-mid1 {
            position: absolute;
            left: var(--filter-1);
            width: calc(var(--filter-2) - var(--filter-1));
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: var(--one);
            opacity: 0;
            z-index: 4;
        }
        .will-pass .finish-animation .level-three-beam-mid1 { animation: beamFadeIn 0.4s linear 0.1s forwards; }
        .will-pass .loop-animation .level-three-beam-mid1 { opacity: 0.85; }

        /* 第三段光束（第2片到第3片：橘色 X 45°，z-index: 4） */
        .level-three-beam-mid2 {
            position: absolute;
            left: var(--filter-2);
            width: calc(var(--filter-3) - var(--filter-2));
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: var(--minus);
            opacity: 0;
            z-index: 4;
        }
        .will-pass .finish-animation .level-three-beam-mid2 { animation: beamFadeIn 0.4s linear 0.65s forwards; }
        .will-pass .loop-animation .level-three-beam-mid2 { opacity: 0.85; }

        /* 第四段輸出光束（第3片到終點：淺藍 Z 0°，z-index: 4） */
        .level-three-beam-after {
            position: absolute;
            left: var(--filter-3);
            width: calc(var(--target-x) - var(--filter-3));
            top: 50%;
            height: 8px;
            border-radius: 999px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, var(--zero), transparent);
            opacity: 0;
            z-index: 4;
        }
        .will-pass .finish-animation .level-three-beam-after { animation: beamFadeIn 0.45s linear 1.2s forwards; }
        .will-pass .loop-animation .level-three-beam-after { opacity: 0.88; }

        /* 移動光點（z-index: 5，穿過偏振片圖片後方） */
        .level-three-dot {
            position: absolute;
            left: 40px;
            top: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            background: var(--unpolarized);
            box-shadow: 0 0 18px var(--unpolarized-deep);
            opacity: 0;
            z-index: 5;
        }
        .intro-animation .level-three-dot { animation: triFilterIntro 1.4s linear forwards; }
        .will-pass .finish-animation .level-three-dot { animation: triFilterFinish 1.85s linear forwards; }
        .will-pass .loop-animation .level-three-dot { animation: triFilterLoop 3.2s linear infinite; }

        /* 三片偏振片圖片（z-index: 11） */
        .level-filter {
            position: absolute;
            top: 50%;
            width: 108px;
            transform: translate(-50%, -49%);
            z-index: 11;
        }
        .level-filter img { width: 100%; height: auto; display: block; }
        .level-filter.f1 { left: var(--filter-1); }
        .level-filter.f2 { left: var(--filter-2); }
        .level-filter.f3 { left: var(--filter-3); }

        /* 偏振片上方基底標籤（Z 為藍色、X 為橘色） */
        .filter-basis-tag {
            position: absolute;
            top: -34px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 3px 9px;
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 950;
        }
        .filter-basis-tag.z-tag {
            background: #eef6ff;
            color: #17345f;
            box-shadow: 0 4px 0 var(--primary-blue);
        }
        .filter-basis-tag.x-tag {
            background: #fff7ed;
            color: #9a3412;
            box-shadow: 0 4px 0 var(--minus);
        }

        /* 中間量子態小標籤 */
        .mid-state-tag {
            position: absolute;
            top: calc(50% - 34px);
            transform: translate(-50%, -50%) scale(0.75);
            white-space: nowrap;
            padding: 2px 7px;
            border: 2.5px solid var(--ink);
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 950;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }
        .mid-state-tag.s1 {
            left: calc((var(--filter-1) + var(--filter-2)) / 2);
            background: #eff6ff;
            color: var(--one);
        }
        .mid-state-tag.s2 {
            left: calc((var(--filter-2) + var(--filter-3)) / 2);
            background: #fff7ed;
            color: var(--minus);
        }
        .will-pass .finish-animation .mid-state-tag.s1 { animation: statePop 0.3s ease-out 0.25s forwards; }
        .will-pass .finish-animation .mid-state-tag.s2 { animation: statePop 0.3s ease-out 0.8s forwards; }
        .will-pass .loop-animation .mid-state-tag { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* 右側結果框、通過光子與 12.5% 標記 */
        .result-placeholder {
            position: absolute;
            left: var(--target-x);
            top: 50%;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 4px dashed rgba(38, 50, 56, 0.82);
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
            pointer-events: none;
        }
        .level-three-scene .passed-photon {
            position: absolute;
            left: var(--target-x);
            top: 50%;
            width: 74px;
            height: 74px;
            transform: translate(-50%, -50%) scale(0.35);
            opacity: 0;
            z-index: 9;
        }
        .will-pass .finish-animation .level-three-scene .passed-photon {
            animation: passedPhotonPop 0.45s ease-out 1.4s forwards;
        }
        .will-pass .loop-animation .level-three-scene .passed-photon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .certainty-label {
            position: absolute;
            left: var(--target-x);
            top: calc(50% - 76px);
            transform: translate(-50%, -50%) scale(0.7);
            min-width: 76px;
            padding: 5px 11px;
            border: 4px solid var(--ink);
            border-radius: 999px;
            background: #ffffff;
            color: var(--pass);
            font-size: 0.92rem;
            font-weight: 950;
            text-align: center;
            box-shadow: 0 6px 0 var(--pass), 0 12px 20px rgba(31, 67, 107, 0.12);
            opacity: 0;
            z-index: 13;
            pointer-events: none;
        }
        .will-pass .finish-animation .certainty-label {
            animation: certaintyPop 0.35s ease-out 1.45s forwards;
        }
        .will-pass .loop-animation .certainty-label {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 彈窗樣式 */
        .level-modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7, 21, 46, 0.28);
            backdrop-filter: blur(4px);
            border-radius: 19px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .level-modal-overlay.show { opacity: 1; visibility: visible; }
        .level-modal-card {
            width: min(360px, 84%);
            border: 5px solid #ddd;
            border-radius: 28px;
            background: white;
            padding: 30px 28px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.24);
            transform: scale(0.78) translateY(20px);
            transition: transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .level-modal-overlay.show .level-modal-card { transform: scale(1) translateY(0); }
        .level-modal-card.success { border-color: var(--pass); }
        .level-modal-card.error { border-color: var(--block); }
        .level-modal-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: 950;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }
        .level-modal-card.success .level-modal-icon { background: var(--pass); box-shadow: 0 0 20px rgba(32, 164, 100, 0.38); }
        .level-modal-card.error .level-modal-icon { background: var(--block); box-shadow: 0 0 20px rgba(217, 67, 67, 0.38); }
        .level-modal-title { margin: 0 0 22px; font-size: 2rem; font-weight: 950; }
        .level-modal-card.success .level-modal-title { color: var(--pass); }
        .level-modal-card.error .level-modal-title { color: var(--block); }
        .level-modal-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: nowrap; }
        .level-modal-btn {
            border: 0;
            border-radius: 999px;
            padding: 12px 30px;
            color: white;
            font-size: 1rem;
            font-weight: 950;
            cursor: pointer;
            background: var(--primary-blue);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            white-space: nowrap;
        }
        .level-modal-card.success .level-modal-btn { background: var(--pass); }
        .level-modal-card.error .level-modal-btn { background: var(--block); }
        .level-modal-card.success .level-modal-btn.secondary { background: var(--pass) !important; color: white; border: 0; }
        .level-modal-card.error .level-modal-btn.secondary { background: #c8cbcf !important; color: #000000; border: 3px solid #a9b0b9; }
        .level-modal-btn:hover { transform: translateY(-3px); box-shadow: 0 7px 16px rgba(0, 0, 0, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes beamIntro {
            0%, 18% { opacity: 0.32; }
            50%, 100% { opacity: 0.9; }
        }
        @keyframes beamFadeIn {
            0% { opacity: 0; }
            100% { opacity: 0.88; }
        }
        @keyframes triFilterIntro {
            0% { left: 40px; transform: scale(0.7); opacity: 0; }
            15% { opacity: 1; }
            100% { left: var(--filter-1); transform: scale(1.05); opacity: 1; }
        }
        @keyframes triFilterFinish {
            0%   { left: var(--filter-1); opacity: 1; background: var(--one); box-shadow: 0 0 18px var(--one); }
            33%  { left: var(--filter-2); opacity: 1; background: var(--one); box-shadow: 0 0 18px var(--one); }
            34%  { left: var(--filter-2); opacity: 1; background: var(--minus); box-shadow: 0 0 18px var(--minus); }
            66%  { left: var(--filter-3); opacity: 1; background: var(--minus); box-shadow: 0 0 18px var(--minus); }
            67%  { left: var(--filter-3); opacity: 1; background: var(--zero); box-shadow: 0 0 18px var(--zero); }
            90%  { left: var(--target-x); opacity: 1; background: var(--zero); box-shadow: 0 0 18px var(--zero); }
            100% { left: var(--target-x); opacity: 0; transform: scale(0.8); }
        }
        @keyframes triFilterLoop {
            0%   { left: 40px; opacity: 0; background: var(--unpolarized); box-shadow: 0 0 18px var(--unpolarized-deep); }
            10%  { opacity: 1; }
            28%  { left: var(--filter-1); background: var(--unpolarized); }
            29%  { left: var(--filter-1); background: var(--one); box-shadow: 0 0 18px var(--one); }
            50%  { left: var(--filter-2); background: var(--one); }
            51%  { left: var(--filter-2); background: var(--minus); box-shadow: 0 0 18px var(--minus); }
            72%  { left: var(--filter-3); background: var(--minus); }
            73%  { left: var(--filter-3); background: var(--zero); box-shadow: 0 0 18px var(--zero); }
            92%  { left: var(--target-x); opacity: 1; background: var(--zero); }
            100% { left: var(--target-x); opacity: 0; }
        }
        @keyframes statePop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes passedPhotonPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
            75% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes certaintyPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7) rotate(-3deg); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        @keyframes choicesPop {
            0% { opacity: 0; transform: translateX(28px) scale(0.92) rotate(2deg); }
            72% { opacity: 1; transform: translateX(-4px) scale(1.03) rotate(-1deg); }
            100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
        }
        @media (max-width: 1180px) {
            .level-three-card { height: auto; min-height: auto; }
            .level-three-shell { grid-template-columns: 1fr; }
            .level-three-stage { min-height: 520px; }
        }
        @media (max-width: 640px) {
            body { padding: 18px 10px; }
            .page-title { padding: 9px 14px; font-size: 17px; }
            .header-center { font-size: 1rem; }
            .main-card { padding: 12px; border-radius: 20px; }
            .level-three-scene { left: 12px; right: 12px; }
            .level-three-scene #levelPhoton { width: 64px; height: 64px; }
            .level-filter { width: 82px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="game/index.html" class="btn-back" title="Back to levels"></a>
            <div class="page-title">Level 12</div>
        </div>
        <div class="header-center">Photon Direction & Polarizer Game</div>
    </div>
    <main class="main-card" data-level-page="12"></main>
    <script>
const photonTypes = {
    unpolarized: { symbol: "?", label: "unpolarized light", angle: "0deg", color: "var(--unpolarized)" },
    vertical: { symbol: "1", label: "90° light", angle: "0deg", color: "var(--one)" },
    horizontal: { symbol: "0", label: "0° light", angle: "90deg", color: "var(--zero)" },
    diagRight: { symbol: "+", label: "45° light", angle: "45deg", color: "var(--plus)" },
    diagLeft: { symbol: "-", label: "-45° light", angle: "-45deg", color: "var(--minus)" }
};

const filterTypes = {
    vertical: { label: "Vertical", basis: "Z-Basis", state: "|1⟩", tagClass: "z-tag", image: "pictures/vertical.svg" },
    diagonalPlus: { label: "Diagonal 45°", basis: "X-Basis", state: "45°", tagClass: "x-tag", image: "pictures/diagonal_45.svg" },
    horizontal: { label: "Horizontal", basis: "Z-Basis", state: "|0⟩", tagClass: "z-tag", image: "pictures/horizontal.svg" }
};

const level = {
    photon: "unpolarized",
    filters: ["vertical", "diagonalPlus", "horizontal"],
    pass: "pass",
    output: "horizontal"
};

const page = document.querySelector("[data-level-page]");
const levelIndex = Math.max(0, Number(page.dataset.levelPage || 1) - 1);
const levelFiles = [
    "game/level1.html",
    "game/level2.html",
    "game/level3.html",
    "game/level4.html",
    "game/level5.html",
    "game/level6.html",
    "game/level7.html",
    "game/level8.html",
    "game/level9.html",
    "game/level10.html",
    "game/level11.html",
    "game/level12.html"
];

function photonMarkup(id = "", extraClass = "") {
    return `<div class="tutorial-photon ${extraClass}" ${id ? `id="${id}"` : ""}><span></span></div>`;
}

function setPhoton(el, state) {
    const photon = photonTypes[state];
    el.dataset.symbol = photon.symbol;
    el.style.setProperty("--beam-color", photon.color);
    el.style.setProperty("--state-angle", photon.angle);
}

function renderLevel() {
    const correctState = "horizontal";
    const correctPercent = "12.5";

    const filtersMarkup = level.filters.map((filterName, index) => {
        const filter = filterTypes[filterName];
        return `
            <div class="level-filter f${index + 1}">
                <span class="filter-basis-tag ${filter.tagClass}">${filter.basis} · ${filter.state}</span>
                <img src="${filter.image}" alt="${filter.label}">
            </div>`;
    }).join("");

    const outputChoices = [
        { answer: "vertical", label: "90°", state: "vertical" },
        { answer: "diagRight", label: "45°", state: "diagRight" },
        { answer: "horizontal", label: "0°", state: "horizontal" },
        { answer: "none", label: "BLOCK", block: true }
    ];

    const choicesMarkup = outputChoices.map((choice) => `
        <button class="option-tile" type="button" data-answer="${choice.answer}" aria-label="${choice.label}">
            <strong>${choice.label}</strong>
            ${choice.block ? '<span class="block-choice-icon"></span>' : photonMarkup("", "choice-photon hide-symbol")}
        </button>
    `).join("");

    page.classList.add("level-three-card");
    page.innerHTML = `
        <section class="level-three-shell">
            <section class="level-three-stage will-pass">
                <div class="level-three-scene">
                    ${photonMarkup("levelPhoton", "unpolarized hide-symbol")}
                    <div class="level-three-beam"></div>
                    <div class="level-three-beam-mid1"></div>
                    <div class="level-three-beam-mid2"></div>
                    <div class="level-three-beam-after"></div>
                    <div class="level-three-dot"></div>
                    <span class="mid-state-tag s1">|1⟩ (Z)</span>
                    <span class="mid-state-tag s2">45° (X)</span>
                    <span class="result-placeholder"></span>
                    ${photonMarkup("passedPhoton", "passed-photon hide-symbol")}
                    <span class="certainty-label">12.5%</span>
                    ${filtersMarkup}
                </div>
                <div class="level-modal-overlay" id="levelResultModal">
                    <div class="level-modal-card" id="levelModalCard">
                        <div class="level-modal-icon" id="levelModalIcon">!</div>
                        <h2 class="level-modal-title" id="levelModalTitle">Correct!</h2>
                        <div class="level-modal-actions">
                            <button class="level-modal-btn" id="levelModalBtn" type="button">OK</button>
                            <button class="level-modal-btn secondary hidden" id="levelModalSecondaryBtn" type="button">Give up</button>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="level-three-panel ready" id="levelPanel">
                <div class="level-badge-static">Level 12</div>
                <h1 class="question">Final result?</h1>
                <div class="level-three-options">${choicesMarkup}</div>
                <div class="percent-section">
                    <p class="percent-section-label">Probability</p>
                    <div class="percent-options">
                        <button class="percent-tile" type="button" data-percent="50">50%</button>
                        <button class="percent-tile" type="button" data-percent="25">25%</button>
                        <button class="percent-tile" type="button" data-percent="12.5">12.5%</button>
                    </div>
                </div>
                <button class="next-level-btn hidden" id="nextLevelBtn" type="button">Back to Levels</button>
            </aside>
        </section>
    `;

    setPhoton(document.getElementById("levelPhoton"), "unpolarized");
    setPhoton(document.getElementById("passedPhoton"), "horizontal");
    document.querySelectorAll(".choice-photon").forEach((el, index) => {
        const choice = outputChoices.filter((item) => !item.block)[index];
        setPhoton(el, choice.state);
    });

    let selectedState = null;
    let selectedPercent = null;
    let isAnimating = false;
    let isReady = false;
    let introTimer = null;
    let delayTimer = null;
    let resultTimer = null;
    let lastCorrect = false;

    const scene = document.querySelector(".level-three-scene");
    const panel = document.getElementById("levelPanel");
    const levelResultModal = document.getElementById("levelResultModal");
    const levelModalCard = document.getElementById("levelModalCard");
    const levelModalIcon = document.getElementById("levelModalIcon");
    const levelModalTitle = document.getElementById("levelModalTitle");
    const levelModalBtn = document.getElementById("levelModalBtn");
    const levelModalSecondaryBtn = document.getElementById("levelModalSecondaryBtn");
    const nextLevelBtn = document.getElementById("nextLevelBtn");

    function setControlsDisabled(disabled) {
        document.querySelectorAll(".option-tile").forEach((item) => {
            item.disabled = disabled;
        });
        document.querySelectorAll(".percent-tile").forEach((item) => {
            item.disabled = disabled || selectedState === "none";
        });
    }

    function startIntro() {
        selectedState = null;
        selectedPercent = null;
        lastCorrect = false;
        isReady = false;
        isAnimating = true;
        setControlsDisabled(true);
        levelResultModal.classList.remove("show");
        nextLevelBtn.classList.add("hidden");
        scene.classList.remove("intro-animation", "finish-animation", "loop-animation");
        document.querySelectorAll(".option-tile, .percent-tile").forEach((item) => {
            item.classList.remove("active", "correct", "wrong");
        });
        void scene.offsetWidth;
        scene.classList.add("intro-animation");
        introTimer = window.setTimeout(() => {
            isReady = true;
            isAnimating = false;
            panel.classList.add("ready");
            setControlsDisabled(false);
        }, 1500);
    }

    function showResultModal(correct) {
        levelModalCard.className = `level-modal-card ${correct ? "success" : "error"}`;
        levelModalIcon.innerHTML = correct ? "&#10003;" : "!";
        levelModalTitle.textContent = correct ? "Correct!" : "Incorrect!";
        levelModalBtn.textContent = correct ? "OK" : "Try again";
        levelModalSecondaryBtn.textContent = correct ? "Level Map" : "Give up";
        levelModalBtn.style.order = correct ? "1" : "2";
        levelModalSecondaryBtn.style.order = correct ? "2" : "1";
        levelModalSecondaryBtn.classList.remove("hidden");
        levelResultModal.classList.add("show");
    }

    function returnToChoice() {
        if (lastCorrect) {
            levelResultModal.classList.remove("show");
            return;
        }
        if (introTimer) window.clearTimeout(introTimer);
        if (delayTimer) window.clearTimeout(delayTimer);
        if (resultTimer) window.clearTimeout(resultTimer);
        introTimer = null;
        delayTimer = null;
        resultTimer = null;
        levelResultModal.classList.remove("show");
        startIntro();
    }

    function evaluateSelection() {
        if (isAnimating || !isReady || !selectedState) return;
        if (selectedState !== "none" && !selectedPercent) return;

        isAnimating = true;
        isReady = false;
        setControlsDisabled(true);
        scene.classList.remove("finish-animation", "loop-animation");

        const isCorrect = selectedState === correctState && selectedPercent === correctPercent;

        if (!isCorrect) {
            lastCorrect = false;
            document.querySelectorAll(".option-tile").forEach((item) => {
                if (item.dataset.answer === selectedState && selectedState !== correctState) {
                    item.classList.add("wrong");
                }
            });
            document.querySelectorAll(".percent-tile").forEach((item) => {
                if (item.dataset.percent === selectedPercent && selectedPercent !== correctPercent) {
                    item.classList.add("wrong");
                }
            });
            nextLevelBtn.classList.add("hidden");
            showResultModal(false);
            isAnimating = false;
            return;
        }

        delayTimer = window.setTimeout(() => {
            void scene.offsetWidth;
            scene.classList.add("finish-animation");
            resultTimer = window.setTimeout(() => {
                lastCorrect = true;
                scene.classList.remove("finish-animation");
                scene.classList.add("loop-animation");
                document.querySelectorAll(".option-tile").forEach((item) => {
                    item.classList.toggle("correct", item.dataset.answer === correctState);
                    item.classList.remove("wrong");
                });
                document.querySelectorAll(".percent-tile").forEach((item) => {
                    item.classList.toggle("correct", item.dataset.percent === correctPercent);
                    item.classList.remove("wrong");
                });
                nextLevelBtn.classList.remove("hidden");
                showResultModal(true);
                isAnimating = false;
            }, 1900);
        }, 350);
    }

    document.querySelectorAll(".option-tile").forEach((btn) => {
        btn.addEventListener("click", () => {
            if (isAnimating || !isReady) return;
            selectedState = btn.dataset.answer;
            document.querySelectorAll(".option-tile").forEach((item) => {
                item.classList.toggle("active", item === btn);
                item.classList.remove("wrong", "correct");
            });
            if (selectedState === "none") {
                selectedPercent = null;
                document.querySelectorAll(".percent-tile").forEach((item) => {
                    item.classList.remove("active", "wrong", "correct");
                    item.disabled = true;
                });
            } else {
                document.querySelectorAll(".percent-tile").forEach((item) => {
                    item.disabled = false;
                });
            }
            evaluateSelection();
        });
    });

    document.querySelectorAll(".percent-tile").forEach((btn) => {
        btn.addEventListener("click", () => {
            if (isAnimating || !isReady || selectedState === "none") return;
            selectedPercent = btn.dataset.percent;
            document.querySelectorAll(".percent-tile").forEach((item) => {
                item.classList.toggle("active", item === btn);
                item.classList.remove("wrong", "correct");
            });
            evaluateSelection();
        });
    });

    levelModalBtn.addEventListener("click", returnToChoice);
    levelModalSecondaryBtn.addEventListener("click", () => {
        window.location.href = levelFiles[levelIndex + 1] || "game/index.html";
    });
    nextLevelBtn.addEventListener("click", () => {
        window.location.href = levelFiles[levelIndex + 1] || "game/index.html";
    });

    startIntro();
}

renderLevel();
    </script>
</body>
</html>
